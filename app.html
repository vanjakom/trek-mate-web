  <body>
    <div id="content">

    <script type="text/javascript">
      // global code, not related to osm / overpass and other specific stuff
      function parseTParameter(url) {
	  const params = new URL(url).searchParams.get("t");
	  if (!params) return [];
	  
	  return params.split('/').map(item => 
	      item.includes('|') 
		  ? item.split('|').map(tag => "#" + tag)
		  : "#" + item
	  );
      }
    </script>
    <script type="text/javascript">
      // code specific to osm / overpass
      
      // trek-mate-osme editor id param format: single letter type prefix
      // ( n/w/r ) followed by the numeric osm id
      function osmIdParam(type, id) {
	  let prefix = type == "node" ? "n" : type == "way" ? "w" : "r"
	  return prefix + id
      }

      // name alone ( pushed unprefixed ) is not considered a usable tag,
      // only #tag / @tag / |tag entries count towards a dot being shown
      function hasUsableTag(allTags) {
	  return allTags.some(function (tag) {
	      return tag.startsWith("#") || tag.startsWith("@") || tag.startsWith("|")
	  })
      }

      async function fetchOverpassData(query) {
	  // 20260228 main overpass is overloaded
	  const overpassUrl = "https://overpass-api.de/api/interpreter"
	  //const overpassUrl = "https://overpass.private.coffee/api/interpreter"
	  console.log("[overpass]" + query)
	  try {
              const response = await fetch(overpassUrl, {
		  method: "POST",
		  headers: {
                      "Content-Type": "application/x-www-form-urlencoded"
		  },
		  body: "data=" + encodeURIComponent(query)
              });
	      
              if (!response.ok) {
		  throw new Error("Overpass API error: " + response.statusText)
              }
	      
              const data = await response.json()
              return parseOverpassResponse(data)
	  } catch (error) {
	      console.error("Error fetching Overpass API:", error)
	      return null
	  }
      }

      function parseOverpassResponse(data) {
	  if (!data.elements) return [];
	  
	  return data.elements.map(function(entry) {
	      let allTags = []
	      let name = trek_mate.app.osmTagsToName(entry.tags)
	      if (name != null) {
		  allTags.push(name)
	      }
	      let osmUrl
	      if (entry.type == "node") {
		  osmUrl = "https://www.openstreetmap.org/node/" + entry.id
	      } else if (entry.type == "way") {
		  osmUrl = "https://www.openstreetmap.org/way/" + entry.id
	      } else {
		  osmUrl = "https://www.openstreetmap.org/relation/" + entry.id
	      }
	      // osm url is added right after title / name
	      allTags.push("|url|osm|" + osmUrl)
	      let contentTags = trek_mate.app.osmTagsToTags(entry.tags)
		  .concat(trek_mate.app.osmTagsToLinks(entry.tags))
	      // ignore dots without any usable tag, only the osm link would be shown
	      if (!hasUsableTag(contentTags)) return null
	      allTags = allTags.concat(contentTags)
	      allTags.push("|osmid|" + entry.type + "|" + entry.id)
	      let location =  {
		  latitude: entry.lat ?? entry.center.lat,
		  longitude: entry.lon ?? entry.center.lon,
		  tags: allTags}
	      console.log(location)
	      return location})
	      .filter(function(location) { return location != null })
      }

      // raw OSM API map call ( https://api.openstreetmap.org/api/0.6/map.json ),
      // no server side tag filtering is available there, unlike overpass, so
      // keep the requested area small ( bbox is also capped by the API itself
      // at 0.25 square degrees )
      async function fetchOSMAPIData(bbox) {
	  const osmApiUrl = "https://api.openstreetmap.org/api/0.6/map.json?bbox=" + bbox
	  console.log("[osmapi]" + osmApiUrl)
	  try {
              const response = await fetch(osmApiUrl);

              if (!response.ok) {
		  throw new Error("OSM API error: " + response.statusText)
              }

              const data = await response.json()
              return parseOSMAPIResponse(data)
	  } catch (error) {
	      console.error("Error fetching OSM API:", error)
	      return null
	  }
      }

      function parseOSMAPIResponse(data) {
	  if (!data.elements) return [];

	  // raw map data includes every untagged node / way that makes up
	  // geometry ( roads, buildings, ... ), index everything by id so
	  // tagged way / relation elements can resolve their own center from
	  // that geometry ( unlike overpass "out center" this is not provided )
	  let nodesById = {}
	  let waysById = {}
	  data.elements.forEach(function(element) {
	      if (element.type == "node") {
		  nodesById[element.id] = {lat: element.lat, lon: element.lon}
	      } else if (element.type == "way") {
		  waysById[element.id] = element
	      }
	  })

	  function wayCenter(way) {
	      let lats = []
	      let lons = []
	      way.nodes.forEach(function(nodeId) {
		  let node = nodesById[nodeId]
		  if (node != null) {
		      lats.push(node.lat)
		      lons.push(node.lon)
		  }
	      })
	      if (lats.length == 0) return null
	      return {
		  lat: (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2,
		  lon: (Math.min.apply(null, lons) + Math.max.apply(null, lons)) / 2}
	  }

	  return data.elements
	      .filter(function(entry) {
		  return entry.tags != null && Object.keys(entry.tags).length > 0
	      })
	      .map(function(entry) {
		  let lat, lon
		  if (entry.type == "node") {
		      lat = entry.lat
		      lon = entry.lon
		  } else if (entry.type == "way") {
		      let center = wayCenter(entry)
		      if (center == null) return null
		      lat = center.lat
		      lon = center.lon
		  } else {
		      // relation, resolve center from member node / way geometry,
		      // nested relation members are not resolved
		      let lats = []
		      let lons = []
		      entry.members.forEach(function(member) {
			  if (member.type == "node" && nodesById[member.ref] != null) {
			      lats.push(nodesById[member.ref].lat)
			      lons.push(nodesById[member.ref].lon)
			  } else if (member.type == "way" && waysById[member.ref] != null) {
			      let center = wayCenter(waysById[member.ref])
			      if (center != null) {
				  lats.push(center.lat)
				  lons.push(center.lon)
			      }
			  }
		      })
		      if (lats.length == 0) return null
		      lat = (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2
		      lon = (Math.min.apply(null, lons) + Math.max.apply(null, lons)) / 2
		  }

		  let allTags = []
		  let name = trek_mate.app.osmTagsToName(entry.tags)
		  if (name != null) {
		      allTags.push(name)
		  }
		  let osmUrl
		  if (entry.type == "node") {
		      osmUrl = "https://www.openstreetmap.org/node/" + entry.id
		  } else if (entry.type == "way") {
		      osmUrl = "https://www.openstreetmap.org/way/" + entry.id
		  } else {
		      osmUrl = "https://www.openstreetmap.org/relation/" + entry.id
		  }
		  // osm url is added right after title / name
		  allTags.push("|url|osm|" + osmUrl)
		  let contentTags = trek_mate.app.osmTagsToTags(entry.tags)
		      .concat(trek_mate.app.osmTagsToLinks(entry.tags))
		  // ignore dots without any usable tag, only the osm link would be shown
		  if (!hasUsableTag(contentTags)) return null
		  allTags = allTags.concat(contentTags)
		  allTags.push("|osmid|" + entry.type + "|" + entry.id)
		  return {
		      latitude: lat,
		      longitude: lon,
		      tags: allTags}
	      })
	      .filter(function(location) { return location != null })
      }

      function getBoundingBox(map) {
	  const bounds = map.getBounds();
	  const southWest = bounds.getSouthWest();
	  const northEast = bounds.getNorthEast();

	  return southWest.lat + "," + southWest.lng + "," +
	      northEast.lat + "," + northEast.lng;
      }

      // bbox of sizeMeters x sizeMeters centered on the map's current center,
      // in "minLon,minLat,maxLon,maxLat" order expected by the OSM API
      function getCenterBoundingBox(map, sizeMeters) {
	  const center = map.getCenter()
	  const latDelta = (sizeMeters / 2) / 111320
	  const lonDelta = (sizeMeters / 2) / (111320 * Math.cos(center.lat * Math.PI / 180))
	  return (center.lng - lonDelta) + "," + (center.lat - latDelta) + "," +
	      (center.lng + lonDelta) + "," + (center.lat + latDelta)
      }

      function locationToMarker(location) {
	  let pins = trek_mate.app.pinsForLocation(location)
	  // take second pin
	  // todo background in first pin
	  let pinUrl =
	      "https://vanjakom.github.io/trek-mate-pins/blue_and_grey/" +
	      pins[1] +
	      ".grey.png"
	  let icon = L.icon({
	      iconUrl: pinUrl,
	      iconSize: [25,25]})
	  let marker = L.marker(
	      [location.latitude, location.longitude],
	      {icon: icon, keyboard: false})
	  marker.on(
	      "click",
	      function () { showLocationTags(location) })
	  return marker
      }

      // presents location's tags as cells in the universal table popup,
      // url tags open their link, plain tags are informational only
      // serializes a location into humandot format
      // ( ~/projects/dataset-git/dots/template.dot ): longitude, latitude on
      // the first line, tags / free text / raw urls indented below,
      // |osmid| is internal only and not part of the format
      function locationToDot(location) {
	  let lines = [location.longitude + ", " + location.latitude]
	  location.tags.forEach(function (tag) {
	      if (tag.startsWith("|osmid|")) {
		  // ignore, internal reference only
	      } else if (tag.startsWith("|url|")) {
		  let parts = tag.split("|")
		  lines.push("   " + parts[3])
	      } else {
		  lines.push("   " + tag)
	      }
	  })
	  return lines.join("\n")
      }

      function showLocationTags(location) {
	  let actions = []
	  actions.push({
	      title: location.longitude + ", " + location.latitude,
	      dismissAfter: false})
	  // report first osm link tag and after other tags
	  for (let index in location.tags) {
	      let tag = location.tags[index]
	      if (tag.startsWith("|url|osm|")) {
		  let parts = tag.split("|")
		  actions.push({
		      title: parts[2],
		      selectFn: function () { window.open(parts[3], "_blank") },
		      dismissAfter: false})
	      }
	  }
	  // report other tags
	  for (let index in location.tags) {
	      let tag = location.tags[index]
	      if (tag.startsWith("|url|osm|")) {
		  // ignore, already reported
	      } else if (tag == "#checkin") {
		  // ignore
	      } else if (tag.startsWith("|url|")) {
		  let parts = tag.split("|")
		  actions.push({
		      title: parts[2],
		      selectFn: function () { window.open(parts[3], "_blank") },
		      dismissAfter: false})
	      } else {
		  actions.push({
		      title: tag,
		      dismissAfter: false})
	      }
	  }
	  // trek-mate osme editor link, built from the |osmid| tag instead of
	  // being stored as a tag itself so it does not end up in "copy dot"
	  for (let index in location.tags) {
	      let tag = location.tags[index]
	      if (tag.startsWith("|osmid|")) {
		  let parts = tag.split("|")
		  let editorUrl =
		      "https://vanjakom.github.io/trek-mate-osme/editor.html?id=" +
		      osmIdParam(parts[2], parts[3])
		  actions.push({
		      title: "trek-mate osme editor",
		      selectFn: function () { window.open(editorUrl, "_blank") },
		      dismissAfter: false})
	      }
	  }
	  actions.push({
	      title: "copy dot",
	      selectFn: function () { navigator.clipboard.writeText(locationToDot(location)) }})
	  openUniversalTable(actions)
      }
    </script>
    
    <script type="text/javascript">
      let map = L.map("map", {maxBoundsViscosity: 1.0})
      map.setMaxBounds ([[-90,-180],[90,180]])
      
      let tileLayers = {
	  "OSM": L.tileLayer(
	      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
	      {
		  attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors",
		  maxZoom: 21,
		  bounds: [[-90,-180],[90,180]],
		  noWrap: true
	      }),
	  "Google Satellite": L.tileLayer(
	      "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
	      {
		  subdomains: ["mt0", "mt1", "mt2", "mt3"],
		  maxZoom: 21,
		  bounds: [[-90,-180],[90,180]],
		  noWrap: true
	      })
      }
      let activeTileLayer = tileLayers["OSM"]
      activeTileLayer.addTo(map)

      function setTileLayer(name) {
	  map.removeLayer(activeTileLayer)
	  activeTileLayer = tileLayers[name]
	  activeTileLayer.addTo(map)
      }

      let dataLayer = L.layerGroup()
      dataLayer.addTo(map)

      let appState = {
	  "popupVisible": false
      }

      // basic port of trek-mate's UniversalTableViewController: renders a
      // list of selectable actions into the popup div, selecting one runs
      // its selectFn and closes the popup unless dismissAfter is false
      // right pad title with spaces so ">" lands as the 80th character,
      // simulating the disclosure chevron of a trek-mate ios table cell
      function padTitleWithChevron(title) {
	  if (title.length >= 79) {
	      return title.substring(0, 79) + ">"
	  }
	  return title + " ".repeat(79 - title.length) + ">"
      }

      function openUniversalTable(actions) {
	  let popup = document.getElementById("popup")
	  popup.innerHTML = ""
	  actions.forEach(function (action) {
	      let row = document.createElement("div")
	      row.style.padding = "10px"
	      row.style.color = "#000000"
	      row.style.borderBottom = "1px solid #CCCCCC"
	      row.style.whiteSpace = "pre"
	      if (action.selectFn) {
		  row.textContent = padTitleWithChevron(action.title)
		  row.style.cursor = "pointer"
		  row.addEventListener(
		      "click",
		      function () {
			  action.selectFn()
			  if (action.dismissAfter !== false) {
			      closeUniversalTable()
			  }
		      })
	      } else {
		  row.textContent = action.title
		  row.style.cursor = "default"
	      }
	      popup.appendChild(row)
	  })
	  popup.style.display = "flex"
	  popup.style.flexDirection = "column"
	  appState.popupVisible = true
      }

      function closeUniversalTable() {
	  let popup = document.getElementById("popup")
	  popup.style.display = "none"
	  appState.popupVisible = false
      }

      map.setView([44.8178131, 20.4568974], 10)


      let tool00 = document.getElementById("tool00")
      let tool01 = document.getElementById("tool01")
      let tool02 = document.getElementById("tool02")
      let tool03 = document.getElementById("tool03")
      let tool04 = document.getElementById("tool04")
      
      tool00.addEventListener(
	  "click",
	  function (event) {
	      if (appState.popupVisible == false) {
		  document.getElementById("popup").style.display = "flex"
		  appState.popupVisible = true
	      } else {
		  document.getElementById("popup").style.display = "none"
		  appState.popupVisible = false
	      }
	  })

      document.addEventListener(
	  "keydown",
	  function (event) {
	      if (event.key == "Escape" && appState.popupVisible) {
		  closeUniversalTable()
	      }
	  })

      tool02.addEventListener(
	  "click",
	  function () {
	      let overpassQuery =
		  "[out:json]" +
		  "[bbox:" + getBoundingBox(map) + "];" +
		  trek_mate.app.generateOverpass(appState.tags) +
		  // return maximum of 100 queries
		  "out center 100;"

	      console.log("[overpass]" + overpassQuery)

	      tool02.src = "https://vanjakom.github.io/trek-mate-pins/tools/reload_on.png"
	      fetchOverpassData(overpassQuery).then(function (result) {
		  // todo keep locations in app state and render from there
		  dataLayer.clearLayers()
		  result.forEach(function (location) {
		      let marker = locationToMarker(location)
		      dataLayer.addLayer(marker)
		  })
		  tool02.src = "https://vanjakom.github.io/trek-mate-pins/tools/reload_off.png"})
	  })

      tool03.addEventListener(
	  "click",
	  function () {
	      let bbox = getCenterBoundingBox(map, 250)

	      tool03.src = "https://vanjakom.github.io/trek-mate-pins/tools/reload_on.png"
	      fetchOSMAPIData(bbox).then(function (result) {
		  // todo keep locations in app state and render from there
		  dataLayer.clearLayers()
		  result.forEach(function (location) {
		      let marker = locationToMarker(location)
		      dataLayer.addLayer(marker)
		  })
		  tool03.src = "https://vanjakom.github.io/trek-mate-pins/tools/reload_off.png"})
	  })

      tool04.addEventListener(
	  "click",
	  function () {
	      openUniversalTable([
		  {title: "OSM", selectFn: function () { setTileLayer("OSM") }},
		  {title: "Google Satellite", selectFn: function () { setTileLayer("Google Satellite") }}
	      ])
	  })

      // add support to get location
      var mousedownInterval = null
      map.on (
	  "mousedown",
	  function (e) {
	      mousedownInterval = setInterval(
		  function() {
		      L
			  .popup({
			      closeOnClick: false})
			  .setLatLng(e.latlng)
			  .setContent(
			      "longitude: " + Number(e.latlng.lng).toFixed(5) + "</br>" +
				  "latitude: " + Number(e.latlng.lat).toFixed(5) + "</br>" +
				  "<a href='http://openstreetmap.org/#map=16/" + e.latlng.lat + "/" + e.latlng.lng + "' target='_blank'>osm</a>" + "</br>" +
				  "<a href='https://vanjakom.github.io/trek-mate-osme/editor.html?longitude=" + Number(e.latlng.lng).toFixed(5) + "&latitude=" + Number(e.latlng.lat).toFixed(5) + "' target='_blank'>new node</a>" + "</br>")
			  .openOn(map)},
		  500)})
      map.on(
	  "mousemove",
	  function (e) {
	      clearInterval(mousedownInterval)})
      map.on(
	  "mouseup",
	  function (e) {
	      clearInterval(mousedownInterval)})

      // state ( current map location )
      var ignoreStateUpdate = false
      let stateSetFn = function() {
	  ignoreStateUpdate = true
	  var hash =
	      "#map=" + map.getZoom() + "/" + map.getCenter().lng + "/" + map.getCenter().lat
	  window.location.hash = hash
	  console.log("state set: " + hash)
      }
      let stateResetFn = function() {
	  if (!ignoreStateUpdate) {
	      if (window.location.hash.length > 1) {
		  console.log("state reset: " + window.location.hash)
		  var params = {}
		  let splits = window.location.hash.substring(1).split("&")
		  for (let index in splits) {
		      let pair = splits[index].split("=")
		      params[pair[0]] = pair[1]
		  }

		  if (params["map"] != null) {
		      let fields = params["map"].split("/")
		      let zoom = parseInt(fields[0])
		      let longitude = parseFloat(fields[1])
		      let latitude = parseFloat(fields[2])

		      map.setView([latitude, longitude], zoom)
		  }
	      } else {
		  // default to Serbia
		  map.setView([44.41599, 21.08276], 8)
	      }
	  } else {
	      console.log("ignore state reset")
	      ignoreStateUpdate = false
	  }
      }
      stateResetFn()
      window.onhashchange = stateResetFn
      map.on("moveend", stateSetFn)
      
      appState.tags = parseTParameter(window.location.href)
      
      console.log("tags:" + appState.tags)
    </script>
  </body>
